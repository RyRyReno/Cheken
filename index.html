
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cheken | Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif}
header{background:#1f2937;padding:22px 7%;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:30px}
main{max-width:1100px;margin:auto;padding:35px 20px}
input{width:100%;padding:15px;background:#253247;border:1px solid #44516a;border-radius:12px;color:white;font-size:16px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-top:25px}
.game{background:#1f2937;border-radius:14px;padding:24px;text-align:center}
.game .emoji{font-size:55px;margin-bottom:20px}
.game h3{margin:10px 0}
.game p{color:#94a3b8}
</style>
</head>
<body>
<header><h1>🐔 Cheken</h1><span>🎮 Games</span></header>
<main>
<h2>Your games. Your playground.</h2>
<input id="search" placeholder="Search games..." oninput="filterGames()">
<h2>All Games</h2>
<div class="games">
<a href="games/minecraft/mc.html"
   style="text-decoration:none;color:inherit">
  <div class="game" data-name="minecraft">
    <div class="emoji">⛏️</div>
    <h3>Minecraft</h3>
    <p>▶ Click to Play</p>
  </div>
</a>
<div class="game" data-name="more games">
<div class="emoji">🎮</div>
<h3>More games</h3><p>Coming soon</p>
</div>
</div>
</main>
<script>
function filterGames(){
const q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.game').forEach(game=>{
game.style.display=game.dataset.name.includes(q)?'':'none';
});
}
</script>
</body>
</html>
